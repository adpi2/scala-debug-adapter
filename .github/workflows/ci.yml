name: Continuous Integration
on:
  push:
  pull_request:

jobs:
  scalafmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: ./bin/scalafmt --test
  test-java-setup:
    strategy:
      fail-fast: false
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 11
        cache: 'sbt'
    - name: Unit tests
      run: sbt 'testOnly *SourceLookUpProviderStats'
      shell: bash
  test-cs-setup:
    strategy:
      fail-fast: false
    name: Tests using Coursier
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - uses: coursier/setup-action@v1.3.0
      with:
        jvm: 'temurin:1.11.0.18'
        apps: sbt
    - name: Unit tests
      run: sbt 'testOnly *SourceLookUpProviderStats'
      shell: bash
